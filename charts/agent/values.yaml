# Default values for sentinel-agent
# These values define the chart contract, not deployment state.

image:
  repository: ayuspoudel/sentinel-agent
  tag: "0.0.0"          # placeholder, must be overridden in real deployments
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  type: ClusterIP
  port: 443

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

sentinelSRE:
  url: ""               # REQUIRED at install time
