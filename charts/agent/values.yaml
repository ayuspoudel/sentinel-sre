# Default values for sentinel-agent
# These values define the chart contract, not deployment state.

namespace:
  name: sentinel
  create: true

image:
  repository: ayuspoudel/sentinel-agent
  tag: "0.0.0"              # placeholder, must be overridden
  pullPolicy: IfNotPresent

replicaCount: 1


sentinelSRE:
  url: "https://example.invalid"   # placeholder, overridden in GitOps

tls:
  secretName: sentinel-agent-tls

webhook:
  failurePolicy: Fail
  timeoutSeconds: 10

selectors:
  namespaceLabel:
    key: sentinel
    value: enabled
  workloadLabel:
    key: sentinel
