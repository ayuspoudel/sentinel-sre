# Default values for sentinel-agent
# These values define the chart contract, not deployment state.

image:
  repository: ayuspoudel/sentinel-agent
  tag: 0.0.0
  pullPolicy: IfNotPresent

replicaCount: 1

env:
  SENTINEL_SRE_URL: "http://changeme.com"

tls:
  secretName: sentinel-agent-tls

webhook:
  failurePolicy: Fail
  timeoutSeconds: 5

selectors:
  namespaceLabel:
    key: sentinel.guard/enabled
    value: "true"
  workloadLabel:
    key: sentinel.guard/name
