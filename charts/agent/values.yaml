namespace:
  name: sentinel
  create: true
image:
  repository: sentinel-agent
  tag: 1.0.1
  pullPolicy: IfNotPresent
replicaCount: 1
sentinelSRE:
  url: "" # REQUIRED 
tls:
  secretName: sentinel-agent-tls
webhook:
  failurePolicy: Fail
  timeoutSeconds: 5
selectors:
  namespaceLabel:
    key: sentinel.guard/enabled
    value: "true"
  workloadLabel:
    key: sentinel.guard/name
