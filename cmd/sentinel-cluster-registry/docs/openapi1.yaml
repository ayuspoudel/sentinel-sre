openapi: 3.0.3

info:
  title: Sentinel Cluster Registry API
  description: >
    Sentinel Control Plane API for registering and managing Kubernetes cluster
    intents. This API stores cluster metadata and credential references and
    exposes read-only state for reconciliation tools such as Terraform.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Service health endpoints
  - name: Clusters
    description: Cluster registration and lookup

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "503":
          description: Service is unhealthy

  /v1/clusters/register:
    post:
      tags: [Clusters]
      summary: Register a cluster using an existing credential reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Cluster registered successfully
        "400":
          description: Invalid request
        "500":
          description: Internal server error

  /v1/clusters/register-with-credentials:
    post:
      tags: [Clusters]
      summary: Register a cluster by uploading kubeconfig credentials
      description: >
        Validates the kubeconfig, selects a context, stores the kubeconfig as a
        Kubernetes Secret, and registers the cluster intent.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - kubeconfig
              properties:
                name:
                  type: string
                  description: Unique cluster name
                  example: sreCluster
                context:
                  type: string
                  description: >
                    Optional kubeconfig context name. If omitted, Sentinel will
                    attempt to auto-select a context.
                  example: sreCluster
                kubeconfig:
                  type: string
                  format: binary
                  description: Kubeconfig file
      responses:
        "201":
          description: Cluster registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterResponse"
        "400":
          description: Invalid kubeconfig or request
        "500":
          description: Internal server error

  /v1/clusters/list:
    get:
      tags: [Clusters]
      summary: List all registered clusters
      responses:
        "200":
          description: List of clusters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cluster"

  /v1/clusters/{name}:
    get:
      tags: [Clusters]
      summary: Get cluster by name
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Cluster name
      responses:
        "200":
          description: Cluster found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "404":
          description: Cluster not found

    delete:
      tags: [Clusters]
      summary: Delete cluster by name
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cluster deleted
        "404":
          description: Cluster not found
        "500":
          description: Internal server error

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - credential_ref
      properties:
        name:
          type: string
          description: Unique cluster name
          example: sreCluster
        credential_ref:
          type: string
          description: Reference to stored credentials
          example: sentinel-cluster-srecluster
        labels:
          type: object
          additionalProperties:
            type: string
          description: Optional cluster labels
          example:
            env: dev

    Cluster:
      type: object
      required:
        - name
        - credential_ref
        - labels
        - created_at
      properties:
        name:
          type: string
          example: sreCluster
        credential_ref:
          type: string
          example: sentinel-cluster-srecluster
        labels:
          type: object
          additionalProperties:
            type: string
          example:
            context: sreCluster
        created_at:
          type: string
          format: date-time
          example: "2026-01-19T18:10:42Z"

    ClusterResponse:
      type: object
      required:
        - cluster_name
        - registered_at
        - source
      properties:
        cluster_name:
          type: string
          example: sreCluster
        credential_ref:
          type: string
          example: sentinel-cluster-srecluster
        labels:
          type: object
          additionalProperties:
            type: string
          example:
            context: sreCluster
        registered_at:
          type: string
          format: date-time
          example: "2026-01-20T16:10:35Z"
        source:
          type: string
          example: api
