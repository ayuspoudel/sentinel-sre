name: Helm Snapshot Update

on:
  push:
    branches:
      - develop
    paths:
      - "charts/**"

  pull_request:
    paths:
      - "charts/**"

  workflow_dispatch:
    inputs:
      chart:
        description: "Chart directory (e.g. charts/agent)"
        required: true
        default: "charts/agent"

env:
  HELM_UNITTEST_VERSION: v0.3.6
  DEFAULT_CHART: "charts/agent"

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    steps:
      - name: Safety check (no main branch)
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "Snapshot updates are not allowed on main"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install helm unittest plugin
        run: |
          helm plugin install \
            https://github.com/helm-unittest/helm-unittest \
            --version $HELM_UNITTEST_VERSION

      - name: Resolve chart path
        run: |
          if [[ -n "${{ inputs.chart }}" ]]; then
            echo "CHART_PATH=${{ inputs.chart }}" >> $GITHUB_ENV
          else
            echo "CHART_PATH=${DEFAULT_CHART}" >> $GITHUB_ENV
          fi

      - name: Update Helm snapshots
        run: |
          set -euo pipefail

          if [[ -z "${CHART_PATH}" ]]; then
            echo "ERROR: CHART_PATH is empty"
            exit 1
          fi

          helm unittest "${CHART_PATH}" --update-snapshot

      - name: Verify snapshot changes only
        run: |
          set -euo pipefail

          CHANGED_FILES=$(git status --porcelain | awk '{print $2}')

          for file in $CHANGED_FILES; do
            if [[ "$file" != *"__snapshot__"* && "$file" != *"__snapshots__"* ]]; then
              echo "Non-snapshot file modified: $file"
              exit 1
            fi
          done

      - name: Commit snapshot updates
        run: |
          git config user.name "sentinelSre-bot"
          git config user.email "sentinelSre-bot@users.noreply.github.com"

          git status --porcelain \
            | awk '{print $2}' \
            | grep '__snapshot__/' \
            | xargs -r git add

          git commit -m "test(chart): update helm snapshots" || {
            echo "No snapshot changes to commit"
            exit 0
          }

      - name: Push snapshot commit
        run: |
          git push origin HEAD
