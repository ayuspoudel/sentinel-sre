name: Helm Chart Tests

on:
#   push:
#     branches:
#       - develop
#     paths:
#       - "charts/**"
  workflow_dispatch:
  pull_request:
    paths:
      - "charts/**"

env:
  CHARTS_DIR: charts
  HELM_UNITTEST_VERSION: v0.3.6

jobs:
  helm-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Start KinD cluster
        uses: helm/kind-action@v1
    
      - name: Ensure sentinel namespace exists
        run: |
            kubectl create namespace sentinel --dry-run=server -o yaml | kubectl apply -f -


      - name: Discover Helm charts
        id: charts
        run: |
          set -euo pipefail
          CHARTS=$(find $CHARTS_DIR -maxdepth 2 -name Chart.yaml -exec dirname {} \;)
          echo "charts<<EOF" >> $GITHUB_OUTPUT
          echo "$CHARTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Helm lint template and kube validation
        run: |
          set -euo pipefail
          for chart in ${{ steps.charts.outputs.charts }}; do
            helm lint "$chart" \
              --set sentinelSRE.url=http://example \
              --set tls.caBundle=dGVzdA==
            helm template sentinel-test "$chart" \
              --set sentinelSRE.url=http://example \
              --set tls.caBundle=dGVzdA== \
              > rendered.yaml
            kubectl apply --dry-run=server -f rendered.yaml
          done

      - name: Install helm unittest plugin
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version $HELM_UNITTEST_VERSION

      - name: Helm unit tests
        run: |
          set -euo pipefail
          for chart in ${{ steps.charts.outputs.charts }}; do
            helm unittest "$chart"
          done

      - name: Install helm diff plugin
        run: |
          helm plugin remove diff || true
          helm plugin install https://github.com/databus23/helm-diff --version v3.9.5

      - name: Helm diff
        run: |
          set -euo pipefail
          for chart in ${{ steps.charts.outputs.charts }}; do
            helm diff upgrade sentinel-test "$chart" \
              --set sentinelSRE.url=http://example \
              --set tls.caBundle=dGVzdA== \
              --allow-unreleased || true
          done

      - name: Chart version gate
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          for chart in ${{ steps.charts.outputs.charts }}; do
            CHART_FILE="$chart/Chart.yaml"
            CHANGED_FILES=$(git diff --name-only origin/develop...HEAD)
            STRUCTURAL_CHANGE=false
            for file in $CHANGED_FILES; do
              if [[ "$file" == "$chart/templates/"* ]] || \
                 [[ "$file" == "$chart/values.yaml" ]] || \
                 [[ "$file" == "$CHART_FILE" ]]; then
                STRUCTURAL_CHANGE=true
              fi
            done
            if [[ "$STRUCTURAL_CHANGE" == "true" ]]; then
              OLD_VERSION=$(git show origin/develop:$CHART_FILE | yq '.version')
              NEW_VERSION=$(yq '.version' "$CHART_FILE")
              if [[ "$OLD_VERSION" == "$NEW_VERSION" ]]; then
                exit 1
              fi
            fi
          done

      - name: Auto bump chart version
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: |
          set -euo pipefail
          for chart in ${{ steps.charts.outputs.charts }}; do
            CHART_FILE="$chart/Chart.yaml"
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
            STRUCTURAL_CHANGE=false
            for file in $CHANGED_FILES; do
              if [[ "$file" == "$chart/templates/"* ]] || \
                 [[ "$file" == "$chart/values.yaml" ]] || \
                 [[ "$file" == "$CHART_FILE" ]]; then
                STRUCTURAL_CHANGE=true
              fi
            done
            if [[ "$STRUCTURAL_CHANGE" != "true" ]]; then
              continue
            fi
            CURRENT_VERSION=$(yq '.version' "$CHART_FILE")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            yq -i ".version = \"$NEW_VERSION\"" "$CHART_FILE"
            git config user.name "sentinel-bot"
            git config user.email "sentinel-bot@users.noreply.github.com"
            git add "$CHART_FILE"
            git commit -m "chore(chart): auto-bump $(basename $chart) to $NEW_VERSION [skip ci]"
          done
          git push origin HEAD:develop
