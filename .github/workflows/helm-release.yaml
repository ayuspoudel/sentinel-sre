name: Helm Chart Release

on:
  workflow_run:
    workflows: ["Helm Chart Version Bump"]
    types:
      - completed

permissions:
  contents: write

env:
  CHARTS_DIR: charts
  GH_PAGES_BRANCH: gh-pages

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Fetch gh-pages
        run: git fetch origin $GH_PAGES_BRANCH || true

      - name: Prepare gh-pages worktree
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/$GH_PAGES_BRANCH; then
            git worktree add docs origin/$GH_PAGES_BRANCH
          else
            git worktree add docs --orphan $GH_PAGES_BRANCH
          fi

      - name: Discover Helm charts
        id: charts
        run: |
          find $CHARTS_DIR -maxdepth 2 -name Chart.yaml -exec dirname {} \; > charts.txt
          echo "charts<<EOF" >> $GITHUB_OUTPUT
          cat charts.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package charts
        run: |
          mkdir -p docs/packages
          for chart in ${{ steps.charts.outputs.charts }}; do
            helm dependency update "$chart" || true
            helm package "$chart" --destination docs/packages
          done

      - name: Update Helm index
        run: |
          helm repo index docs \
            --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} \
            --merge docs/index.yaml || \
          helm repo index docs \
            --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Publish Helm repo
        run: |
          cd docs
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No new charts to publish"
            exit 0
          fi

          git config user.name "sentinelSRE-bot"
          git config user.email "sentinelSRE-bot@users.noreply.github.com"
          git add .
          git commit -m "chore(release): publish helm charts"
          git push origin HEAD:$GH_PAGES_BRANCH
