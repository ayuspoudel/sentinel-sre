name: Helm Chart Release

on:
  push:
    branches:
      - develop
    paths:
      - "charts/**"

permissions:
    contents: write
env:
  CHARTS_DIR: charts

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Discover Helm charts
        id: charts
        run: |
          set -euo pipefail
          CHARTS=$(find $CHARTS_DIR -maxdepth 2 -name Chart.yaml -exec dirname {} \;)
          echo "charts<<EOF" >> $GITHUB_OUTPUT
          echo "$CHARTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package charts
        run: |
          set -euo pipefail
          mkdir -p docs
          for chart in ${{ steps.charts.outputs.charts }}; do
            helm dependency update "$chart" || true
            helm package "$chart" --destination docs
          done

      - name: Generate Helm index
        run: |
          helm repo index docs \
            --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Publish Helm repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
