name: Helm Chart Release

on:
  workflow_run:
    workflows: ["Helm Chart Version Bump"]
    types:
      - completed

permissions:
  contents: write

env:
  CHARTS_DIR: charts
  GH_PAGES_BRANCH: gh-pages

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      # Fresh gh-pages checkout (no merge, no history pollution)
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GH_PAGES_BRANCH }}
          path: docs
        continue-on-error: true

      - name: Reset gh-pages content
        run: |
          rm -rf docs/*
          mkdir -p docs

      - name: Discover Helm charts
        id: charts
        run: |
          find $CHARTS_DIR -maxdepth 2 -name Chart.yaml -exec dirname {} \; > charts.txt
          echo "charts<<EOF" >> $GITHUB_OUTPUT
          cat charts.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package charts
        run: |
          set -euo pipefail
          for chart in ${{ steps.charts.outputs.charts }}; do
            helm dependency update "$chart" || true
            helm package "$chart" --destination docs
          done

      - name: Generate Helm index
        run: |
          helm repo index docs \
            --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Publish Helm repo
        run: |
          cd docs

          git checkout -B $GH_PAGES_BRANCH

          git config user.name "sentinelSRE-bot"
          git config user.email "sentinelSRE-bot@users.noreply.github.com"

          git add .
          git commit -m "chore(release): publish helm charts" || {
            echo "No changes to publish"
            exit 0
          }

          git push --force origin $GH_PAGES_BRANCH

