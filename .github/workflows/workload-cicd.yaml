name: Workload CI/CD 
run-name: Ran by ${GITHUB_ACTOR}

on:
  push:
    branches: [ develop ]
    paths:
      - "workload-canary/**"
      - "workload-stable/**"
      - "workload-flaky/**"
  workflow_dispatch:
    inputs:
      workload:
        description: "Which workload to release (stable | canary | flaky)"
        required: true
        default: "canary"

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      REGISTRY: docker.io
      VALUES_FILE: helm/sentinel-workload/values.yaml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            token: ${{ secrets.GITOPS_TOKEN }}
            fetch-depth: 0

      - name: Determine workload
        id: workload
        run: |
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                echo "name=${{ inputs.workload }}" >> $GITHUB_OUTPUT
            else
                if git diff --name-only HEAD~1 | grep -q workload-canary; then
                echo "name=canary" >> $GITHUB_OUTPUT
                elif git diff --name-only HEAD~1 | grep -q workload-flaky; then
                echo "name=flaky" >> $GITHUB_OUTPUT
                elif git diff --name-only HEAD~1 | grep -q workload-stable; then
                echo "name=stable" >> $GITHUB_OUTPUT
                else
                echo "No workload changes detected"
                exit 1
                fi
            fi

      - name: Read current version from values.yaml
        id: version
        run: |
            APP=${{ steps.workload.outputs.name }}
            CURRENT=$(yq e ".apps.${APP}.image.tag" $VALUES_FILE)
            echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Bump patch version
        id: bump
        run: |
            v=${{ steps.version.outputs.current }}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$v"
            PATCH=$((PATCH+1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        run: |
            APP=${{ steps.workload.outputs.name }}
            VERSION=${{ steps.bump.outputs.new }}
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/workload-${APP}:${VERSION}"
            docker build -t "$IMAGE" ./workload-${APP}
            docker push "$IMAGE"

      - name: Update Helm values.yaml
        run: |
            APP=${{ steps.workload.outputs.name }}
            VERSION=${{ steps.bump.outputs.new }}
            yq -i ".apps.${APP}.image.tag = \"${VERSION}\"" $VALUES_FILE

      - name: Commit GitOps change
        run: |
            APP=${{ steps.workload.outputs.name }}
            VERSION=${{ steps.bump.outputs.new }}
            git config user.name "sentinel-ci"
            git config user.email "sentinel-ci@users.noreply.github.com"
            git add $VALUES_FILE
            git commit -m "release(${APP}): ${VERSION}"
            git push
