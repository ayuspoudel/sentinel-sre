name: Workload CI/CD
run-name: Ran by ${{ github.actor }}

on:
  push:
    branches: [ develop ]
    paths:
      - "playground/workload-canary/**"
      - "playground/workload-stable/**"
      - "playground/workload-flaky/**"
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set-matrix
        run: |
          APPS=()

          git diff --name-only HEAD~1 | grep -q workload-canary && APPS+=("canary")
          git diff --name-only HEAD~1 | grep -q workload-stable && APPS+=("stable")
          git diff --name-only HEAD~1 | grep -q workload-flaky && APPS+=("flaky")

          if [ ${#APPS[@]} -eq 0 ]; then
            MATRIX="[]"
          else
            MATRIX=$(printf '%s\n' "${APPS[@]}" | jq -R -s -c 'split("\n")[:-1]')
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  release:
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: ${{ fromJson(needs.detect.outputs.matrix) }}

    outputs:
      changes: ${{ steps.emit.outputs.change }}

    env:
      VALUES_FILE: playground/helm/sentinel-workload/values.yaml

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: version
        run: |
          CURRENT=$(yq e ".apps.${{ matrix.app }}.image.tag" $VALUES_FILE)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          IFS='.' read -r M m p <<< "${{ steps.version.outputs.current }}"
          echo "new=$M.$m.$((p+1))" >> $GITHUB_OUTPUT

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USER }}/workload-${{ matrix.app }}:${{ steps.bump.outputs.new }}"
          docker build -t "$IMAGE" ./playground/workload-${{ matrix.app }}
          docker push "$IMAGE"

      - name: Emit structured change
        id: emit
        run: |
          echo "::group::Emit change"
          CHANGE=$(jq -n \
            --arg app "${{ matrix.app }}" \
            --arg version "${{ steps.bump.outputs.new }}" \
            '{app: $app, version: $version}')
          echo "$CHANGE"
          echo "change=$CHANGE" >> $GITHUB_OUTPUT
          echo "::endgroup::"

  gitops:
    needs: release
    runs-on: ubuntu-latest
    if: needs.release.outputs.changes != ''

    env:
      VALUES_FILE: playground/helm/sentinel-workload/values.yaml

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          fetch-depth: 0

      - name: Apply GitOps changes
        run: |
          echo "::group::Applying GitOps changes"

          CHANGES='${{ needs.release.outputs.changes }}'

          echo "$CHANGES" | jq -c '.' | while read -r change; do
            APP=$(echo "$change" | jq -r '.app')
            VERSION=$(echo "$change" | jq -r '.version')

            echo "Updating $APP -> $VERSION"
            yq -i ".apps.${APP}.image.tag = \"${VERSION}\"" $VALUES_FILE
          done

          echo "::endgroup::"

      - name: Commit & push
        run: |
          git diff --quiet && exit 0

          git config user.name "sentinel-ci"
          git config user.email "sentinel-ci@users.noreply.github.com"

          git add $VALUES_FILE
          git commit -m "gitops: update workload images"
          git push
