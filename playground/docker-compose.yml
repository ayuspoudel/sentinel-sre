version: "3.9"

services:
  workload:
    image: sentinel-workload
    container_name: sentinel-workload
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 5

  loadgen:
    image: sentinel-loadgen
    container_name: sentinel-loadgen
    depends_on:
      workload:
        condition: service_healthy
    environment:
      TARGET_URL: http://workload:8080/work
      CONCURRENCY: "20"
      SLEEP_MS: "20"

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      workload:
        condition: service_healthy
