services:
  workload:
    image: sentinel-workload
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 2s
      timeout: 1s
      retries: 10

  loadgen:
    image: sentinel-loadgen
    depends_on:
      workload:
        condition: service_healthy
    environment:
      TARGET_URL: http://workload:8080/work
      CONCURRENCY: 10
      SLEEP_MS: 100

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      workload:
        condition: service_healthy
