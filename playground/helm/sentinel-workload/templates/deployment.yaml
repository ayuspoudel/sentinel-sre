{{- range $appName, $app := .Values.apps }}
{{- if $app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app.name }}
  labels:
    app: {{ $app.name }}
spec:
  replicas: {{ $app.replicas }}
  selector:
    matchLabels:
      app: {{ $app.name }}
  template:
    metadata:
      labels:
        app: {{ $app.name }}
    spec:
      containers:
        - name: {{ $app.name }}
          image: "{{ $app.image.repository }}:{{ $app.image.tag }}"
          imagePullPolicy: Always
          env:
            {{- range $key, $val := $app.env }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}
          ports:
            - containerPort: {{ $.Values.service.port }}
---
{{- end }}
{{- end }}
