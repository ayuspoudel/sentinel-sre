{{- range $appName, $app := .Values.apps }}
{{- if $app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app.name }}
  labels:
    app: {{ $app.name }}
spec:
  replicas: {{ $app.replicas }}
  selector:
    matchLabels:
      app: {{ $app.name }}
  template:
    metadata:
      labels:
        app: {{ $app.name }}
    spec:
      containers:
        - name: {{ $app.name }}
          image: "{{ $app.image.repository }}:{{ $app.image.tag }}"
          imagePullPolicy: Always

          env:
            # Required identity
            - name: APP_NAME
              value: "{{ $app.name }}"

            - name: DEPLOYMENT_NAME
              value: "{{ $app.name }}"

            - name: CLUSTER_NAME
              value: "{{ $.Values.clusterName }}"

            # Optional per-app tuning
            {{- range $key, $val := $app.env }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}

          ports:
            - containerPort: {{ $.Values.service.port }}
---
{{- end }}
{{- end }}
