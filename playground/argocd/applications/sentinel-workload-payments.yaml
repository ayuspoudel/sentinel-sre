apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-workload-payments
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ayuspoudel/sentinel-sre.git
    targetRevision: develop
    path: playground/helm/sentinel-workload
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: clusterName
          value: paymentsCluster

  destination:
    name: paymentsCluster
    namespace: sentinel-workload

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
