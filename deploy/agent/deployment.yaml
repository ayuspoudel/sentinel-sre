apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-agent
  namespace: sentinel-sre
  labels:
    app.kubernetes.io/name: sentinel-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-agent
    spec:
      serviceAccountName: sentinel-agent
      containers:
        - name: agent
          image: sentinel-agent:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--listen=:8443"
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
          env:
            - name: SENTINEL_SRE_URL
              value: "http://sentinel-sre.svc.cluster.local:8080"
      volumes:
        - name: tls
          secret:
            secretName: sentinel-agent-tls
